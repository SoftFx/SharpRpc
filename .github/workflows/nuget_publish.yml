name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for NuGet Trusted Publishing (OIDC)

jobs:
  build:

    runs-on: ubuntu-latest
    environment: Nuget

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: src/

    - name: Materialize Signing Key
      id: write_sign_key_file
      uses: timheuer/base64-to-file@v1
      with:
        fileName: 'SoftFx.snk'
        encodedString: ${{ secrets.SOFTFX_CERT }}

    - name: Build
      run: dotnet build --configuration Release --no-restore
      working-directory: src/
      env:
        SignAssembly: true
        AssemblyOriginatorKeyFile: ${{ steps.write_sign_key_file.outputs.filePath }}

    - name: Pack
      run: |
        dotnet pack src/SharpRpc/SharpRpc.csproj --configuration Release --no-build --output ./nupkgs
        dotnet pack src/SharpRpc.Builder/SharpRpc.Builder.csproj --configuration Release --no-build --output ./nupkgs

    - name: NuGet login (Trusted Publishing)
      id: login
      uses: NuGet/login@v1
      with:
        user: SoftFx

    - name: Push
      run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
